<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }

      .bg-gradient {
        background: linear-gradient(
          135deg,
          #fdf2f8 0%,
          #fce7f3 40%,
          #fbcfe8 70%,
          #f9a8d4 100%
        );
      }

      /* Floating petals */
      .petal {
        position: fixed;
        font-size: 1.4rem;
        opacity: 0;
        animation: fall linear infinite;
        pointer-events: none;
        user-select: none;
      }
      @keyframes fall {
        0% {
          transform: translateY(-60px) rotate(0deg);
          opacity: 0.7;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* Clue text */
      .clue-text {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: #9d174d;
        text-shadow: 0 2px 24px rgba(244, 114, 182, 0.25);
        animation: gentle-pulse 4s ease-in-out infinite;
      }
      @keyframes gentle-pulse {
        0%,
        100% {
          text-shadow: 0 2px 24px rgba(244, 114, 182, 0.2);
        }
        50% {
          text-shadow: 0 4px 40px rgba(244, 114, 182, 0.5);
        }
      }

      /* Card */
      .card {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(16px);
        border: 1.5px solid rgba(249, 168, 212, 0.5);
        box-shadow:
          0 8px 48px rgba(236, 72, 153, 0.12),
          0 2px 8px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body
    class="bg-gradient min-h-screen flex items-center justify-center px-6 overflow-hidden"
  >
    <!-- Floating petals (rendered by JS) -->
    <div id="petals"></div>

    <!-- Card -->
    <div
      class="card relative z-10 rounded-3xl px-8 py-12 text-center max-w-xl mx-auto w-full"
    >
      <!-- Top badge -->
      <p
        class="text-pink-400 text-sm tracking-widest uppercase font-semibold mb-5"
      >
        🌸 Szczęśliwego dnia mamy 🌸
      </p>

      <!-- Divider -->
      <div class="flex items-center justify-center gap-3 mb-8">
        <div class="h-px flex-1 bg-pink-200"></div>
        <span class="text-pink-300 text-lg">✿</span>
        <div class="h-px flex-1 bg-pink-200"></div>
      </div>

      <!-- Clue label -->
      <p
        class="text-pink-300 text-xs tracking-[0.35em] uppercase font-semibold mb-4"
      >
        Wskazówka
      </p>

      <!-- Main clue text -->
      <h1
        class="clue-text leading-tight mb-8"
        style="font-size: clamp(2.4rem, 9vw, 5.5rem)"
      >
        Zobacz tam gdzie robi się obiadki.
      </h1>

      <!-- Bottom divider -->
      <div class="flex items-center justify-center gap-3">
        <div class="h-px flex-1 bg-pink-200"></div>
        <span class="text-pink-300 text-lg">✿</span>
        <div class="h-px flex-1 bg-pink-200"></div>
      </div>
    </div>

    <script>
      const emojis = ["🌸", "🌷", "💐", "🌺", "🩷", "✿"];
      const container = document.getElementById("petals");
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.className = "petal";
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = 5 + Math.random() * 8 + "s";
        el.style.animationDelay = Math.random() * 10 + "s";
        el.style.fontSize = 1 + Math.random() * 1.2 + "rem";
        container.appendChild(el);
      }
    </script>
  </body>
</html>
